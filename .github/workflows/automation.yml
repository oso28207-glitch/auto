name: Soo Automation — تحميل ورفع

on:
  workflow_dispatch:
    inputs:
      check_interval:
        description: 'CHECK_INTERVAL (0 = مرة واحدة)'
        required: false
        default: '0'
      max_episodes:
        description: 'حد أقصى للحلقات في الدورة (0 = بلا حد)'
        required: false
        default: '0'

  schedule:
    - cron: '0 */6 * * *'

  push:
    branches: [main]
    paths:
      - 'checker.py'
      - 'downloader.py'
      - 'uploader.py'
      - 'orchestrator.py'
      - 'builder.py'
      - 'database.py'
      - 'config.py'
      - 'run.py'
      - 'requirements.txt'
      - '.github/workflows/automation.yml'

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # ═══════════════════════════════════════════════════════════
    # FlareSolverr — يتجاوز Cloudflare تلقائياً
    # ═══════════════════════════════════════════════════════════
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          BROWSER_TIMEOUT: 90000
          CAPTCHA_SOLVER: none
        options: >-
          --health-cmd "curl -f http://localhost:8191/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    steps:
      # ═══════════════════════════════════════════════════════════
      # 1) Checkout
      # ═══════════════════════════════════════════════════════════
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════════
      # 2) Python
      # ═══════════════════════════════════════════════════════════
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ═══════════════════════════════════════════════════════════
      # 3) ffmpeg — نسخة ثابتة سريعة
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install ffmpeg (static — سريع)
        run: |
          mkdir -p $HOME/bin
          cd /tmp
          echo "⬇️  تحميل ffmpeg static..."
          curl -fsSL --max-time 120 -o ffmpeg.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg $HOME/bin/
          mv ffmpeg-*-amd64-static/ffprobe $HOME/bin/
          chmod +x $HOME/bin/ffmpeg $HOME/bin/ffprobe
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/ffmpeg -version | head -1

      # ═══════════════════════════════════════════════════════════
      # 4) Python deps
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "── pip check ──"
          pip check || true
          echo "── yt-dlp impersonate targets ──"
          yt-dlp --list-impersonate-targets | head -20 || true

      # ═══════════════════════════════════════════════════════════
      # 5) انتظار FlareSolverr
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Wait for FlareSolverr
        run: |
          echo "انتظار FlareSolverr على localhost:8191..."
          for i in $(seq 1 40); do
            if curl -s -f -o /dev/null http://localhost:8191/health; then
              echo "✅ FlareSolverr جاهز بعد ${i} محاولة"
              curl -s http://localhost:8191/health | head -c 200
              echo ""
              exit 0
            fi
            echo "   محاولة $i/40..."
            sleep 3
          done
          echo "❌ FlareSolverr لم يصبح جاهزاً — استمرار بدون"
          exit 0

      # ═══════════════════════════════════════════════════════════
      # 6) إنشاء .env من الأسرار
      # ═══════════════════════════════════════════════════════════
      - name: 🔑 Create .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SOURCE_BASE_URL: ${{ secrets.SOURCE_BASE_URL }}
          SOURCE_SERIES_PATH: ${{ secrets.SOURCE_SERIES_PATH }}
          SOURCE_LIST_SELECTOR: ${{ secrets.SOURCE_LIST_SELECTOR }}
          SOURCE_EP_SELECTOR: ${{ secrets.SOURCE_EP_SELECTOR }}
          API_BASE: ${{ secrets.API_BASE }}
          IMPERSONATE_TARGET: ${{ secrets.IMPERSONATE_TARGET }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '0' }}
        run: |
          {
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
            echo "SESSION_STRING=${SESSION_STRING}"
            echo "CHANNEL_ID=${CHANNEL_ID}"
            echo "SOURCE_BASE_URL=${SOURCE_BASE_URL}"
            echo "SOURCE_SERIES_PATH=${SOURCE_SERIES_PATH}"
            echo "SOURCE_LIST_SELECTOR=${SOURCE_LIST_SELECTOR}"
            echo "SOURCE_EP_SELECTOR=${SOURCE_EP_SELECTOR}"
            echo "API_BASE=${API_BASE}"
            echo "IMPERSONATE_TARGET=${IMPERSONATE_TARGET:-chrome}"
            echo "FLARESOLVERR_URL=http://localhost:8191/v1"
            echo "USE_FLARESOLVERR=true"
            echo "MAX_EPISODES=${MAX_EPISODES}"
            echo "MAX_RETRIES=2"
            echo "RETRY_DELAY=10"
            echo "CHECK_INTERVAL=${{ github.event.inputs.check_interval || 0 }}"
            echo "AUTO_BUILD=true"
            echo "KEEP_MEDIA=false"
          } > .env

          echo "── .env (القيم الحساسة محجوبة) ──"
          grep -v -E "API_HASH|SESSION_STRING|BOT_TOKEN|API_ID" .env

      # ═══════════════════════════════════════════════════════════
      # 7) تشغيل النظام
      # ═══════════════════════════════════════════════════════════
      - name: 🚀 Run automation
        run: python run.py

      # ═══════════════════════════════════════════════════════════
      # 8) حفظ الحالة (حتى عند الفشل)
      # ═══════════════════════════════════════════════════════════
      - name: 💾 Commit state + docs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data docs
          git add data/state.json data/state.backup.json docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "لا تغييرات لحفظها"
          else
            git commit -m "🤖 تحديث تلقائي: $(date -u +'%Y-%m-%d %H:%M')"
            git push || {
              echo "⚠️ فشل الدفع، محاولة مرة أخرى..."
              sleep 5
              git pull --rebase --autostash || true
              git push || echo "❌ فشل الدفع النهائي"
            }
          fi

      # ═══════════════════════════════════════════════════════════
      # 9) تنظيف الملفات الكبيرة
      # ═══════════════════════════════════════════════════════════
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf data/media/* 2>/dev/null || true
          df -h | head -3
