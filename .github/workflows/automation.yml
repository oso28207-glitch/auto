name: 🎬 Shoof Automation
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['downloader.py', 'run_all.py', 'sources/**', 'telegram_checker.py', 'uploader.py']

permissions:
  contents: write

concurrency:
  group: shoof
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Africa/Cairo'
  PYTHONUNBUFFERED: '1'
  DISPLAY: ':99'

jobs:
  automate:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Chrome + Xvfb
        run: |
          sudo apt-get install -y -qq xvfb wget
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq /tmp/chrome.deb
          rm -f /tmp/chrome.deb
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: pip
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check || true

      - name: .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          cat > .env << EOF
          API_ID=${API_ID}
          API_HASH=${API_HASH}
          SESSION_STRING=${SESSION_STRING}
          CHANNEL_ID=${CHANNEL_ID}
          ENABLED_SOURCES=u3seq,yam,egybest
          SOURCE_BASE_URL=https://o.3seq.cam
          SOURCE_CATEGORY=0
          SOURCE_MAX_PAGES=20
          YAM_BASE_URL=https://yam.ahwaktv.net
          YAM_SERIES_PATH=/moslslat.php
          EGYBEST_BASE_URL=https://egybesstt.baby
          EGYBEST_SERIES_PATH=/all-series.php
          CHECK_CHANNELS=shoofcima,shoofFilm
          CHECK_CHANNEL_LIMIT=3000
          CHECK_CACHE_TTL=3600
          MAX_EPISODES_PER_RUN=0
          MAX_RUNTIME_SECONDS=9900
          SKIP_COMPRESS=false
          COMPRESS_SCALE=240
          COMPRESS_CRF=32
          COMPRESS_PRESET=veryfast
          COMPRESS_AUDIO_BITRATE=32k
          COMPRESS_MAX_SIZE_MB=45
          M3U8_SEARCH_TIMEOUT=25
          OPEN_TIMEOUT=10
          EPISODE_TIMEOUT=240
          EOF
          grep -v -E "API_HASH|SESSION_STRING|API_ID" .env

      - name: 🚀 Run
        run: python run_all.py 2>&1 || true

      - name: 💾 Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ docs/ 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "🤖 تحديث: $(date -u +'%Y-%m-%d %H:%M')" || true
          for i in 1 2 3; do
            git push && break || (git pull --rebase --autostash || true; sleep 5)
          done