name: Shoof Multi-Source Automation

on:
  workflow_dispatch:
    inputs:
      max_episodes:
        description: 'حد أقصى للحلقات (0 = بلا حد)'
        required: false
        default: '0'
      max_runtime_minutes:
        description: 'الحد الزمني للدورة (دقائق)'
        required: false
        default: '165'

  schedule:
    - cron: '0 */4 * * *'

  push:
    branches: [main]
    paths:
      - '*.py'
      - 'sources/**'
      - 'requirements.txt'
      - '.github/workflows/automation.yml'

concurrency:
  group: shoof-full
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 220

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 🖥️ Install Xvfb + Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          wget -q -O /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          sudo apt-get install -y -qq /tmp/chrome.deb
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check || true

      - name: 🔑 Create .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SOURCE_BASE_URL: ${{ secrets.SOURCE_BASE_URL }}
          SOURCE_CATEGORY: ${{ secrets.SOURCE_CATEGORY }}
          API_BASE: ${{ secrets.API_BASE }}
          CHECK_CHANNELS: ${{ secrets.CHECK_CHANNELS }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '0' }}
          MAX_RUNTIME_MIN: ${{ github.event.inputs.max_runtime_minutes || '165' }}
        run: |
          MAX_SEC=$(( ${MAX_RUNTIME_MIN} * 60 ))
          {
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
            echo "SESSION_STRING=${SESSION_STRING}"
            echo "CHANNEL_ID=${CHANNEL_ID}"
            echo "SOURCE_BASE_URL=${SOURCE_BASE_URL:-https://u.3seq.com}"
            echo "SOURCE_CATEGORY=${SOURCE_CATEGORY:-712}"
            echo "SOURCE_MAX_PAGES=20"
            echo "API_BASE=${API_BASE}"
            # ★★★ المصادر المتعددة
            echo "ENABLED_SOURCES=u3seq,yam,egybest"
            echo "YAM_BASE_URL=https://yam.ahwaktv.net"
            echo "YAM_SERIES_PATH=/moslslat.php"
            echo "EGYBEST_BASE_URL=https://egybesstt.baby"
            echo "EGYBEST_SERIES_PATH=/all-series.php"
            # ★★★ سلوك
            echo "MAX_EPISODES_PER_RUN=${MAX_EPISODES}"
            echo "MAX_RUNTIME_SECONDS=${MAX_SEC}"
            echo "IMPERSONATE_TARGET=chrome120"
            echo "AUTO_BUILD=true"
            echo "SKIP_COMPRESS=false"
            echo "KEEP_MEDIA=false"
            # ★★★ الضغط — 45 ميجا
            echo "COMPRESS_SCALE=240"
            echo "COMPRESS_CRF=32"
            echo "COMPRESS_PRESET=slow"
            echo "COMPRESS_AUDIO_BITRATE=32k"
            echo "COMPRESS_MAX_SIZE_MB=45"
            echo "COMPRESS_USE_TWOPASS=true"
            # ★★★ فحص القنوات
            echo "CHECK_CHANNELS=${CHECK_CHANNELS:-shoofcima,shoofFilm}"
            echo "CHECK_CHANNEL_LIMIT=3000"
            echo "CHECK_CACHE_TTL=1800"
            # ★★★ التحديث الفوري
            echo "REALTIME_PUSH=true"
            echo "REALTIME_PUSH_INTERVAL=60"
            # ★★★ yt-dlp
            echo "YTDLP_CONCURRENT=16"
            echo "YTDLP_THROTTLED_RATE=2M"
            echo "YTDLP_MIN_SPEED_KB=800"
            echo "YTDLP_MAX_STALL=20"
            # ★★★ Timeouts
            echo "YTDLP_TIMEOUT=120"
            echo "CF_TIMEOUT=30"
            echo "BROWSER_TIMEOUT=180"
            echo "SERVER_TIMEOUT=180"
            # ★★★ cffi
            echo "CURL_CFFI_WORKERS=8"
          } > .env

          echo "── .env (القيم الحساسة محجوبة) ──"
          grep -v -E "API_HASH|SESSION_STRING|BOT_TOKEN|API_ID" .env

      - name: 🚀 Run all
        run: python run_all.py

      - name: 💾 Final commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "🤖 تحديث نهائي: $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git push && break || {
                git pull --rebase --autostash || true
                sleep 5
              }
            done
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -9 -f "yt-dlp" 2>/dev/null || true
          pkill -9 -f "chrome" 2>/dev/null || true
          pkill -9 -f "ffmpeg" 2>/dev/null || true
          rm -rf data/media/* 2>/dev/null || true
          rm -f /tmp/tmp*.txt /tmp/tmp*.log /tmp/tmp*.mp4 /tmp/tmp*.ts 2>/dev/null || true
          df -h | head -3