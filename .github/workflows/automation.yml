name: Shoof Full Automation

on:
  workflow_dispatch:
    inputs:
      max_episodes:
        description: 'حد أقصى للحلقات'
        required: false
        default: '0'

  schedule:
    - cron: '0 */4 * * *'

  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/automation.yml'

concurrency:
  group: shoof-full
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 220

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 🖥️ Install Xvfb + Chrome
        run: |
          sudo apt-get install -y -qq xvfb
          wget -q -O /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          sudo apt-get install -y -qq /tmp/chrome.deb
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: 📦 Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check || true

      - name: 🔑 Create .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SOURCE_BASE_URL: ${{ secrets.SOURCE_BASE_URL }}
          SOURCE_CATEGORY: ${{ secrets.SOURCE_CATEGORY }}
          API_BASE: ${{ secrets.API_BASE }}
          CHECK_CHANNELS: ${{ secrets.CHECK_CHANNELS }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '0' }}
        run: |
          {
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
            echo "SESSION_STRING=${SESSION_STRING}"
            echo "CHANNEL_ID=${CHANNEL_ID}"
            echo "SOURCE_BASE_URL=${SOURCE_BASE_URL:-https://u.3seq.com}"
            echo "SOURCE_CATEGORY=${SOURCE_CATEGORY:-712}"
            echo "SOURCE_MAX_PAGES=20"
            echo "API_BASE=${API_BASE}"
            echo "MAX_EPISODES_PER_RUN=${MAX_EPISODES}"
            echo "MAX_RUNTIME_SECONDS=9900"
            echo "IMPERSONATE_TARGET=chrome120"
            echo "AUTO_BUILD=true"
            echo "SKIP_COMPRESS=false"
            echo "KEEP_MEDIA=false"
            echo "COMPRESS_SCALE=240"
            echo "COMPRESS_CRF=28"
            echo "CHECK_CHANNELS=${CHECK_CHANNELS:-shoofcima,shoofFilm}"
            echo "CHECK_CHANNEL_LIMIT=3000"
            echo "REALTIME_PUSH=true"
            echo "REALTIME_PUSH_INTERVAL=60"
            echo "YTDLP_CONCURRENT=8"
            echo "YTDLP_THROTTLED_RATE=1M"
          } > .env
          grep -v -E "API_HASH|SESSION_STRING|API_ID" .env

      - name: 🚀 Run all scripts
        run: python run_all.py

      - name: 💾 Final commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/ docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "🤖 تحديث نهائي: $(date -u +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git push && break || {
                git pull --rebase --autostash || true
                sleep 5
              }
            done
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf data/media/* 2>/dev/null || true
          df -h | head -3