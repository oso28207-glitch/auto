name: Shoof Automation

on:
  # تشغيل يدوي
  workflow_dispatch:
    inputs:
      max_episodes:
        description: 'حد أقصى للحلقات في الدورة (0 = بلا حد)'
        required: false
        default: '0'

  # تشغيل تلقائي كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'

  # عند push على الملفات المؤثرة
  push:
    branches: [main]
    paths:
      - 'checker.py'
      - 'downloader.py'
      - 'uploader.py'
      - 'orchestrator.py'
      - 'builder.py'
      - 'database.py'
      - 'config.py'
      - 'run.py'
      - 'requirements.txt'
      - '.github/workflows/automation.yml'

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ═══════════════════════════════════════════════════════════
      # 1) Checkout
      # ═══════════════════════════════════════════════════════════
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════════
      # 2) Python
      # ═══════════════════════════════════════════════════════════
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ═══════════════════════════════════════════════════════════
      # 3) ffmpeg — من مستودع Ubuntu (أكثر استقراراً)
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install ffmpeg (from Ubuntu repo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo "── التحقق ──"
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # ═══════════════════════════════════════════════════════════
      # 4) Xvfb + Chrome (لـ SeleniumBase)
      # ═══════════════════════════════════════════════════════════
      - name: 🖥️ Install Xvfb + Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

          # ثبّت Chrome عبر .deb الرسمي
          wget -q -O /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          sudo apt-get install -y -qq /tmp/chrome.deb

          # شغّل Xvfb
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "✅ Xvfb و Chrome جاهزان"

      # ═══════════════════════════════════════════════════════════
      # 5) Python deps
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "── pip check ──"
          pip check || true
          echo "── التحقق من الأدوات ──"
          yt-dlp --version
          python -c "import imageio_ffmpeg; print('imageio-ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())" || true

      # ═══════════════════════════════════════════════════════════
      # 6) إنشاء .env من الأسرار
      # ═══════════════════════════════════════════════════════════
      - name: 🔑 Create .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SOURCE_BASE_URL: ${{ secrets.SOURCE_BASE_URL }}
          SOURCE_CATEGORY: ${{ secrets.SOURCE_CATEGORY }}
          API_BASE: ${{ secrets.API_BASE }}
          IMPERSONATE_TARGET: ${{ secrets.IMPERSONATE_TARGET }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '0' }}
        run: |
          {
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
            echo "SESSION_STRING=${SESSION_STRING}"
            echo "CHANNEL_ID=${CHANNEL_ID}"
            echo "SOURCE_BASE_URL=${SOURCE_BASE_URL:-https://u.3seq.com}"
            echo "SOURCE_CATEGORY=${SOURCE_CATEGORY:-712}"
            echo "SOURCE_MAX_PAGES=20"
            echo "API_BASE=${API_BASE}"
            echo "MAX_EPISODES_PER_RUN=${MAX_EPISODES}"
            echo "IMPERSONATE_TARGET=${IMPERSONATE_TARGET:-chrome120}"
            echo "AUTO_BUILD=true"
            echo "SKIP_COMPRESS=false"
            echo "KEEP_MEDIA=false"
            echo "COMPRESS_SCALE=240"
            echo "COMPRESS_CRF=28"
          } > .env

          echo "── .env (القيم الحساسة محجوبة) ──"
          grep -v -E "API_HASH|SESSION_STRING|BOT_TOKEN|API_ID" .env

      # ═══════════════════════════════════════════════════════════
      # 7) تشغيل النظام
      # ═══════════════════════════════════════════════════════════
      - name: 🚀 Run automation
        run: python run.py

      # ═══════════════════════════════════════════════════════════
      # 8) حفظ الحالة + docs (حتى عند الفشل)
      # ═══════════════════════════════════════════════════════════
      - name: 💾 Commit state + docs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p data docs
          git add data/state.json data/state.backup.json docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "لا تغييرات لحفظها"
          else
            git commit -m "🤖 تحديث تلقائي: $(date -u +'%Y-%m-%d %H:%M')"
            git push || {
              echo "⚠️ فشل الدفع، محاولة مرة أخرى..."
              sleep 5
              git pull --rebase --autostash || true
              git push || echo "❌ فشل الدفع النهائي"
            }
          fi

      # ═══════════════════════════════════════════════════════════
      # 9) تنظيف الملفات المؤقتة
      # ═══════════════════════════════════════════════════════════
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf data/media/* 2>/dev/null || true
          rm -f /tmp/tmp*.txt 2>/dev/null || true
          df -h | head -3