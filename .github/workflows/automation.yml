name: Soo Automation — تحميل ورفع

on:
  workflow_dispatch:
    inputs:
      check_interval:
        description: 'CHECK_INTERVAL (0 = مرة واحدة)'
        required: false
        default: '0'
      max_episodes:
        description: 'حد أقصى للحلقات في الدورة (0 = بلا حد)'
        required: false
        default: '0'

  schedule:
    - cron: '0 */6 * * *'

  push:
    branches: [main]
    paths:
      - 'checker.py'
      - 'downloader.py'
      - 'uploader.py'
      - 'orchestrator.py'
      - 'builder.py'
      - 'database.py'
      - 'config.py'
      - 'run.py'
      - 'requirements.txt'
      - '.github/workflows/automation.yml'

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # ═══════════════════════════════════════════════════════
      # 1) Checkout
      # ═══════════════════════════════════════════════════════
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════
      # 2) Python
      # ═══════════════════════════════════════════════════════
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ═══════════════════════════════════════════════════════
      # 3) ffmpeg — عبر GitHub Action موثوق
      # ═══════════════════════════════════════════════════════
      - name: 📦 Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Verify ffmpeg
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # ═══════════════════════════════════════════════════════
      # 4) Xvfb + Chrome (لـ SeleniumBase)
      # ═══════════════════════════════════════════════════════
      - name: 🖥️ Install Xvfb + Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          
          # ثبّت Chrome عبر .deb الرسمي
          wget -q -O /tmp/chrome.deb \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
          sudo apt-get install -y -qq /tmp/chrome.deb
          
          # شغّل Xvfb
          sudo Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "✅ Xvfb و Chrome جاهزان"

      # ═══════════════════════════════════════════════════════
      # 5) Python deps
      # ═══════════════════════════════════════════════════════
      - name: 📦 Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "── pip check ──"
          pip check || true
          echo "── التحقق من yt-dlp ──"
          yt-dlp --version

      # ═══════════════════════════════════════════════════════
      # 6) إنشاء .env
      # ═══════════════════════════════════════════════════════
      - name: 🔑 Create .env
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SOURCE_BASE_URL: ${{ secrets.SOURCE_BASE_URL }}
          SOURCE_SERIES_PATH: ${{ secrets.SOURCE_SERIES_PATH }}
          SOURCE_LIST_SELECTOR: ${{ secrets.SOURCE_LIST_SELECTOR }}
          SOURCE_EP_SELECTOR: ${{ secrets.SOURCE_EP_SELECTOR }}
          API_BASE: ${{ secrets.API_BASE }}
          IMPERSONATE_TARGET: ${{ secrets.IMPERSONATE_TARGET }}
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '0' }}
        run: |
          {
            echo "API_ID=${API_ID}"
            echo "API_HASH=${API_HASH}"
            echo "SESSION_STRING=${SESSION_STRING}"
            echo "CHANNEL_ID=${CHANNEL_ID}"
            echo "SOURCE_BASE_URL=${SOURCE_BASE_URL}"
            echo "SOURCE_SERIES_PATH=${SOURCE_SERIES_PATH}"
            echo "SOURCE_LIST_SELECTOR=${SOURCE_LIST_SELECTOR}"
            echo "SOURCE_EP_SELECTOR=${SOURCE_EP_SELECTOR}"
            echo "API_BASE=${API_BASE}"
            echo "IMPERSONATE_TARGET=${IMPERSONATE_TARGET:-chrome120}"
            echo "MAX_EPISODES=${MAX_EPISODES}"
            echo "MAX_RETRIES=2"
            echo "RETRY_DELAY=10"
            echo "CHECK_INTERVAL=${{ github.event.inputs.check_interval || 0 }}"
            echo "AUTO_BUILD=true"
            echo "KEEP_MEDIA=false"
            echo "SKIP_COMPRESS=false"
          } > .env
          
          echo "── .env ──"
          grep -v -E "API_HASH|SESSION_STRING|BOT_TOKEN|API_ID" .env

      # ═══════════════════════════════════════════════════════
      # 7) تشغيل النظام
      # ═══════════════════════════════════════════════════════
      - name: 🚀 Run automation
        run: python run.py

      # ═══════════════════════════════════════════════════════
      # 8) حفظ الحالة
      # ═══════════════════════════════════════════════════════
      - name: 💾 Commit state + docs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data docs
          git add data/state.json data/state.backup.json docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "لا تغييرات"
          else
            git commit -m "🤖 تحديث تلقائي: $(date -u +'%Y-%m-%d %H:%M')"
            git push || {
              sleep 5
              git pull --rebase --autostash || true
              git push || echo "❌ فشل الدفع"
            }
          fi

      # ═══════════════════════════════════════════════════════
      # 9) تنظيف
      # ═══════════════════════════════════════════════════════
      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf data/media/* 2>/dev/null || true
          df -h | head -3
