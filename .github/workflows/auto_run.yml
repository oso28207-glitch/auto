name: Auto Fetch, Compress, Upload & Deploy Site

on:
  schedule:
    - cron: '0 */6 * * *' # يعمل كل 6 ساعات
  workflow_dispatch: # يسمح بالتشغيل اليدوي من تبويب Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Create .env file from Secrets
        run: |
          echo "API_ID=${{ secrets.API_ID }}" >> .env
          echo "API_HASH=${{ secrets.API_HASH }}" >> .env
          echo "SESSION_STRING=${{ secrets.SESSION_STRING }}" >> .env
          echo "CHANNEL_ID=${{ secrets.CHANNEL_ID }}" >> .env
          echo "SOURCE_URL=${{ secrets.SOURCE_URL }}" >> .env

      - name: Run Automation Script
        run: |
          python run_all.py
        env:
          CI: true

      - name: Commit and Push Website Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "🤖 Auto-update: Website content refreshed"
          git push