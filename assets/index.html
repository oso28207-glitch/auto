<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="شوف — منصة مشاهدة المسلسلات">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شوف">
<title>شوف — Shoof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%236366f1' width='100' height='100' rx='22'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3Eش%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
      <div class="logo-icon">ش</div>
      <div class="logo-text">
        <span class="logo-main">شوف</span>
        <span class="logo-sub">SHOOF</span>
      </div>
    </a>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="ابحث عن مسلسل..." autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <span class="hero-badge">🎬 جديد</span>
    <h1 class="hero-title">شاهد أحدث المسلسلات</h1>
    <p class="hero-subtitle">مكتبة ضخمة من المسلسلات المدبلجة والمترجمة بجودة عالية</p>
    <button class="hero-cta" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">
      استكشف الآن
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>
  <div class="hero-pattern"></div>
</section>

<nav class="tabs" id="tabs">
  <button class="tab active" data-sort="recent">الأحدث</button>
  <button class="tab" data-sort="name">الاسم</button>
  <button class="tab" data-sort="episodes">الأكثر حلقات</button>
</nav>

<section class="stats-bar">
  <div class="stat"><span class="stat-num" id="statSeries">0</span><span class="stat-label">مسلسل</span></div>
  <div class="stat"><span class="stat-num" id="statEpisodes">0</span><span class="stat-label">حلقة</span></div>
  <div class="stat"><span class="stat-num" id="statUpdated">—</span><span class="stat-label">آخر تحديث</span></div>
</section>

<main class="container">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
  </div>

  <div class="error-box hidden" id="errorBox">
    <h3>حدث خطأ</h3>
    <p id="errorMsg">تعذر تحميل البيانات</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>

  <div class="empty-box hidden" id="emptyBox">
    <h3>لا توجد نتائج</h3>
    <p>جرب كلمة بحث أخرى</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="load-more-wrap hidden" id="loadMoreWrap">
    <button class="load-more" id="loadMore">عرض المزيد</button>
  </div>
</main>

<!-- Series Detail Modal -->
<div class="modal hidden" id="seriesModal">
  <div class="modal-backdrop" onclick="closeSeries()"></div>
  <div class="modal-content series-modal">
    <button class="modal-close" onclick="closeSeries()">✕</button>
    <div class="series-header">
      <h2 id="seriesTitle">—</h2>
      <p id="seriesMeta"></p>
    </div>
    <div class="episodes-grid" id="episodesGrid"></div>
  </div>
</div>

<!-- Player Modal -->
<div class="modal hidden" id="playerModal">
  <div class="modal-backdrop" onclick="closePlayer()"></div>
  <div class="modal-content">
    <button class="modal-close" onclick="closePlayer()">✕</button>
    <div class="player-wrap">
      <video id="player" controls playsinline preload="metadata" controlsList="nodownload">
        متصفحك لا يدعم الفيديو.
      </video>
      <div class="player-loader hidden" id="playerLoader">
        <div class="spinner"></div>
      </div>
    </div>
    <div class="modal-info">
      <h2 id="modalTitle">—</h2>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand"><div class="logo-icon small">ش</div><span>شوف</span></div>
    <p>© <span id="year"></span> شوف — جميع الحقوق محفوظة</p>
  </div>
</footer>

<button class="scroll-top hidden" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="أعلى">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="m18 15-6-6-6 6"/>
  </svg>
</button>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
